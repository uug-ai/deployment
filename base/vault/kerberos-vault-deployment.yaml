apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vault
    spec:
      initContainers:
        - name: wait-for-mongodb-before-starup
          image: busybox
          command: ["sh", "-c", "until nc -z mongodb.mongodb 27017 > /dev/null; do echo Waiting for master.; sleep 2; done;"]
      containers:
        - name: vault
          image: ghcr.io/uug-ai/vault:v1.4.9
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 100m
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: mongodb
            # Optional plaintext runtime configuration for local development.
            - configMapRef:
                name: vault-runtime-configuration
                optional: true
          env:
            - name: GIN_MODE
              value: release