# Replace all example credentials before applying this manifest.
# Keep the populated file outside source control in production.
apiVersion: v1
kind: Secret
metadata:
  name: vault-runtime-configuration
type: Opaque
stringData:
  KERBEROS_LOGIN_USERNAME: "root"
  KERBEROS_LOGIN_PASSWORD: "kerberos"
  MQTT_URI: "tcp://mqtt.kerberos.io:1883"
  MQTT_USERNAME: ""
  MQTT_PASSWORD: ""
  VAULT_STORAGE_PROVIDERS: >-
    [{"name":"archive","provider":"minio","host":"minio.minio.svc:9000","region":"us-east-1","bucket":"recordings","access_key":"example-key","secret":"example-secret","use_ssl":"false"}]
  VAULT_INTEGRATIONS: >-
    [{"name":"events","queue":"rabbitmq","broker":"amqp://rabbitmq.rabbitmq.svc:5672","topic":"recordings","username":"example-user","password":"example-password"}]
  VAULT_ACCOUNTS: >-
    [{"account":"camera-fleet","directory":"fleet","provider":"archive","access_key":"example-account-key","secret_access_key":"example-account-secret","limit":"30","queues":["events"]}]
